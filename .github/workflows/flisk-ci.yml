# Shared Flisk CI from flisk-sh/.github: CodeQL.
name: Flisk CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "41 4 * * 1" # weekly CodeQL, so new vulnerability queries reach code that has not changed
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flisk-ci-${{ github.repository }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docs:
    name: Docs and workflow tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
      - run: node --test tests/*.test.mjs

  codeql:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: flisk-sh/.github/.github/workflows/codeql.yml@b5eeea945364038cd2143e9676b77fc9af293dfa # v1.4.0
