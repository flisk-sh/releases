name: Notify Scoop bucket

on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test release notification contract
        run: node --test tests/notify-scoop.test.mjs
      - name: Notify the Scoop bucket
        env:
          DISPATCH_TOKEN: ${{ secrets.SCOOP_BUCKET_DISPATCH_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          if [[ -z "$DISPATCH_TOKEN" ]]; then
            echo "::error::Set SCOOP_BUCKET_DISPATCH_TOKEN with contents:write access to flisk-sh/scoop-bucket"
            exit 1
          fi
          payload="$(jq -cn --arg tag "$RELEASE_TAG" '{event_type: "flisk-release-published", client_payload: {tag: $tag}}')"
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $DISPATCH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/flisk-sh/scoop-bucket/dispatches \
            -d "$payload"
